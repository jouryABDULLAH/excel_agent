[project]
name = "excel-agent"
version = "0.1.0"
description = "An agent that turns natural language into add, edit and remove actions on an Excel sheet."
requires-python = ">=3.10"

dependencies = [
    "langchain>=0.3",
    "langchain-groq>=0.2",
    "langgraph>=0.2",
    "pandas>=2.2",
    "openpyxl>=3.1",
    "tabulate>=0.9",
]

[project.optional-dependencies]
# pip install .[ui]
ui = [
    "streamlit>=1.40",
]

# pip install .[google]
google = [
    "google-api-python-client>=2.100",
    "google-auth-httplib2>=0.2",
    "google-auth-oauthlib>=1.2",
]

# pip install .[dev]
dev = [
    "pytest>=8.0",
    "python-dotenv>=1.0",
]

[project.scripts]
excel-agent = "excel_agent.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]