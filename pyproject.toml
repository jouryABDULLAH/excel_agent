[project]
name = "excel-agent"
version = "0.1.0"
description = "An agent that turns natural language into add, edit and remove actions on a Google spreadsheet."
requires-python = ">=3.10"

dependencies = [
    "langchain>=0.3",
    "langchain-groq>=0.2",
    "langgraph>=0.2",
    "google-api-python-client>=2.100",
    "google-auth-httplib2>=0.2",
    "google-auth-oauthlib>=1.2",
    # The agent reads its own .env, so this is not a dev-only convenience.
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
# pip install .[ui]
ui = [
    "streamlit>=1.40",
]

# pip install .[dev]
dev = [
    "pytest>=8.0",
]

[project.scripts]
excel-agent = "excel_agent.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
# The real-model tests cost money and need a key, so they are opt in:
#   pytest -m real
markers = ["real: calls the Groq API instead of a scripted model"]
addopts = "-m 'not real'"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]